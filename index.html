<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio – [Ton Nom]</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ══════════════════════════════
     HOME PAGE
══════════════════════════════ -->
    <div id="page-home">
      <div class="g-logo" aria-label="Portfolio">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span
        ><span>e</span>
      </div>
      <p class="g-tagline">Portfolio de <strong>Nina SCHOELLHAMMER</strong></p>

      <div class="search-wrapper">
        <div class="search-bar" id="home-search-bar">
          <svg
            class="search-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            type="text"
            id="search-input"
            placeholder="Rechercher sur Portfolio..."
            autocomplete="off"
            spellcheck="false"
            aria-label="Recherche"
          />
          <svg
            class="mic-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
          </svg>
        </div>
        <div class="autocomplete" id="autocomplete"></div>
      </div>

      <div class="search-buttons">
        <button class="g-btn" onclick="doSearch('intro')">
          Recherche Portfolio
        </button>
        <button class="g-btn" onclick="doSearch('lucky')">
          J'ai de la chance
        </button>
      </div>

      <footer class="home-footer">
        <div>France</div>
        <div>
          <a href="#">À propos</a> · <a href="#">Contact</a> ·
          <a href="#">CV PDF</a>
        </div>
      </footer>
    </div>

    <!-- ══════════════════════════════
     RESULTS PAGE
══════════════════════════════ -->
    <div id="page-results">
      <header class="results-header">
        <div class="results-header-top">
          <div
            class="results-logo"
            onclick="goHome()"
            title="Retour à l'accueil"
          >
            <span>G</span><span>o</span><span>o</span><span>g</span
            ><span>l</span><span>e</span>
          </div>
          <div class="top-search-wrapper">
            <div class="top-search-bar" id="top-search-bar">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#9aa0a6"
                stroke-width="2"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                id="top-search-input"
                autocomplete="off"
                spellcheck="false"
              />
              <svg
                onclick="clearTopSearch()"
                style="cursor: pointer; color: #9aa0a6"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
              </svg>
            </div>
            <div class="top-autocomplete" id="top-autocomplete"></div>
          </div>
        </div>
        <div class="results-tools">
          <div class="tool-tab active">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            Tout
          </div>
          <div class="tool-tab">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M3 9h18M9 21V9" />
            </svg>
            Projets
          </div>
          <div class="tool-tab">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.64 3.45 2 2 0 0 1 3.62 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.96a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.73 16.29z"
              />
            </svg>
            Contact
          </div>
          <div class="tool-tab">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
            </svg>
            CV
          </div>
          <div class="tool-tab">Outils</div>
        </div>
      </header>

      <div class="results-body">
        <main class="results-main" id="results-main">
          <!-- injected by JS -->
        </main>
        <aside class="knowledge-card" id="knowledge-card">
          <!-- injected by JS -->
        </aside>
      </div>

      <footer class="results-footer">
        <span>Gif-sur-Yvette, Île-de-France · 0,000042 secondes</span>
        <span
          ><a href="#" style="color: var(--text-sec); text-decoration: none"
            >À propos</a
          >
          ·
          <a href="#" style="color: var(--text-sec); text-decoration: none"
            >Confidentialité</a
          ></span
        >
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
