<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NinaGPT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Söhne:wght@400;500;600&family=Söhne+Mono&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #212121;
    --bg-secondary: #2f2f2f;
    --bg-input: #2f2f2f;
    --bg-hover: #3a3a3a;
    --text: #ececec;
    --text-muted: #8e8ea0;
    --text-dim: #b4b4b4;
    --border: #3f3f3f;
    --accent: #10a37f;
    --accent-hover: #0d8f6f;
    --pill-bg: #2f2f2f;
    --pill-hover: #3a3a3a;
    --response-bg: #212121;
    --sidebar-bg: #171717;
    --font: 'DM Sans', -apple-system, sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* ─── TOPBAR ─── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: var(--bg);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.15s;
  }
  .brand:hover { background: var(--bg-hover); }

  .brand-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .brand-chevron {
    color: var(--text-muted);
    font-size: 12px;
    margin-left: 2px;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-outline {
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
  }
  .btn-outline:hover { background: var(--bg-hover); }

  .btn-primary {
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: var(--text);
    color: #000;
  }
  .btn-primary:hover { background: #d4d4d4; }

  /* ─── LANG TOGGLE ─── */
  .lang-toggle {
    display: flex;
    align-items: center;
    background: var(--bg-secondary);
    border-radius: 8px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .lang-btn {
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .lang-btn.active {
    background: var(--bg-hover);
    color: var(--text);
  }

  /* ─── MAIN HOME ─── */
  .home-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 80px 20px 180px;
    transition: opacity 0.3s;
  }

  .home-title {
    font-size: clamp(28px, 5vw, 36px);
    font-weight: 600;
    color: var(--text);
    margin-bottom: 32px;
    text-align: center;
    letter-spacing: -0.5px;
  }

  /* ─── SEARCH BOX ─── */
  .search-wrapper {
    width: 100%;
    max-width: 680px;
    position: relative;
  }

  .search-box {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 56px 18px 20px;
    font-size: 16px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: none;
    min-height: 60px;
    line-height: 1.5;
  }
  .search-box::placeholder { color: var(--text-muted); }
  .search-box:focus {
    border-color: #555;
    box-shadow: 0 0 0 1px #555;
  }

  .search-send {
    position: absolute;
    right: 12px;
    bottom: 12px;
    width: 34px; height: 34px;
    background: var(--text);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    color: #000;
  }
  .search-send:hover { background: #d4d4d4; }
  .search-send:disabled { background: var(--border); cursor: default; }
  .search-send:disabled svg path { stroke: var(--text-muted); }

  /* ─── SUGGESTIONS DROPDOWN ─── */
  .suggestions-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    left: 0; right: 0;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    z-index: 200;
    display: none;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .suggestions-dropdown.visible { display: block; }

  .suggestion-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: background 0.15s;
    color: var(--text);
    font-size: 14px;
  }
  .suggestion-item:hover { background: var(--bg-hover); }
  .suggestion-icon {
    width: 32px; height: 32px;
    background: var(--bg-hover);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .suggestion-meta { color: var(--text-muted); font-size: 12px; margin-top: 1px; }

  /* ─── SUGGESTION PILLS ─── */
  .pills-row {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 680px;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 13px;
    font-family: var(--font);
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .pill:hover {
    background: var(--pill-hover);
    color: var(--text);
    border-color: #555;
  }
  .pill-emoji { font-size: 15px; }

  /* ─── RESPONSE SCREEN ─── */
  .response-screen {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding-top: 64px;
  }
  .response-screen.active { display: flex; }

  .response-content {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 200px;
    width: 100%;
  }

  /* ─── USER MESSAGE ─── */
  .user-message-bubble {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 24px;
  }
  .user-bubble {
    background: var(--bg-secondary);
    border-radius: 18px 18px 4px 18px;
    padding: 12px 18px;
    font-size: 15px;
    max-width: 80%;
    line-height: 1.5;
  }

  /* ─── NINA RESPONSE ─── */
  .nina-response {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
  }
  .nina-avatar {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .nina-text { flex: 1; font-size: 15px; line-height: 1.7; color: var(--text); }

  .nina-text h2 {
    font-size: 20px;
    font-weight: 600;
    margin: 28px 0 12px;
    color: var(--text);
  }
  .nina-text h2:first-child { margin-top: 0; }
  .nina-text h3 {
    font-size: 15px;
    font-weight: 600;
    margin: 20px 0 8px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 12px;
  }
  .nina-text p { margin-bottom: 12px; }
  .nina-text ul { padding-left: 20px; margin-bottom: 12px; }
  .nina-text li { margin-bottom: 6px; }

  .tag {
    display: inline-block;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--text-dim);
    margin: 3px;
  }
  .tag.green { border-color: #10a37f44; color: #10a37f; background: #10a37f11; }
  .tag.blue { border-color: #3b82f644; color: #60a5fa; background: #3b82f611; }
  .tag.purple { border-color: #a855f744; color: #c084fc; background: #a855f711; }
  .tag.orange { border-color: #f97316aa; color: #fb923c; background: #f9731611; }

  .project-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    transition: border-color 0.15s;
  }
  .project-card:hover { border-color: #555; }
  .project-card-title {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .project-card-desc { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  .timeline-item {
    display: flex;
    gap: 16px;
    padding-bottom: 24px;
    position: relative;
  }
  .timeline-item::before {
    content: '';
    position: absolute;
    left: 15px;
    top: 28px;
    bottom: 0;
    width: 1px;
    background: var(--border);
  }
  .timeline-item:last-child::before { display: none; }
  .timeline-dot {
    width: 32px; height: 32px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .timeline-body { flex: 1; }
  .timeline-date { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-family: var(--font-mono); }
  .timeline-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .timeline-sub { font-size: 13px; color: var(--text-dim); line-height: 1.5; }

  /* ─── TYPING ANIMATION ─── */
  .typing-indicator {
    display: flex; gap: 4px; align-items: center;
    padding: 8px 0;
  }
  .typing-dot {
    width: 6px; height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: typing 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-3px); }
  }

  /* ─── BOTTOM INPUT (response mode) ─── */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 16px 20px 24px;
    background: linear-gradient(transparent, var(--bg) 40%);
    z-index: 50;
  }
  .bottom-input-wrap {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }
  .bottom-box {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 56px 14px 18px;
    font-size: 15px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    resize: none;
    min-height: 52px;
  }
  .bottom-box::placeholder { color: var(--text-muted); }
  .bottom-box:focus { border-color: #555; }
  .bottom-send {
    position: absolute;
    right: 10px; bottom: 10px;
    width: 32px; height: 32px;
    background: var(--text);
    border: none; border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #000;
    transition: background 0.15s;
  }
  .bottom-send:hover { background: #d4d4d4; }

  /* ─── ACTION ROW (below response) ─── */
  .action-row {
    display: flex;
    gap: 6px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .action-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: var(--font);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .action-btn:hover { background: var(--bg-secondary); color: var(--text); }

  /* ─── RELATED PILLS ─── */
  .related-section { margin-top: 32px; border-top: 1px solid var(--border); padding-top: 20px; }
  .related-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .related-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .related-pill {
    padding: 8px 14px;
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .related-pill:hover { background: var(--bg-hover); color: var(--text); border-color: #555; }

  /* ─── BACK BUTTON ─── */
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: var(--font);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .back-btn:hover { background: var(--bg-secondary); color: var(--text); }

  /* ─── DIVIDER ─── */
  hr.section-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }

  .fade-in { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* skill bar */
  .skill-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .skill-label { width: 120px; font-size: 13px; color: var(--text-dim); flex-shrink: 0; }
  .skill-bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 3px; }
  .skill-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.8s ease; }

  .lang-level { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }

  @media (max-width: 600px) {
    .pills-row { gap: 6px; }
    .pill { font-size: 12px; padding: 8px 12px; }
    .home-title { font-size: 24px; }
  }
</style>
</head>
<body>

<!-- ─── TOPBAR ─── -->

<!-- ─── HOME SCREEN ─── -->
<main class="home-screen" id="homeScreen">
  <h1 class="home-title" id="homeTitle">Ready when you are.</h1>

  <div class="search-wrapper">
    <textarea class="search-box" id="mainSearch" rows="1"
      placeholder="Ask me anything about Nina…"
      oninput="handleInput(this)"
      onkeydown="handleKey(event)"
      onfocus="showSuggestions()"
    ></textarea>
    <button class="search-send" id="mainSendBtn" onclick="submitSearch()" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
    <div class="suggestions-dropdown" id="suggestionsDropdown"></div>
  </div>

  <div class="pills-row" id="pillsRow"></div>
</main>

<!-- ─── RESPONSE SCREEN ─── -->
<section class="response-screen" id="responseScreen">
  <div class="response-content" id="responseContent"></div>
</section>

<!-- ─── BOTTOM BAR (response mode) ─── -->
<div class="bottom-bar" id="bottomBar" style="display:none">
  <div class="bottom-input-wrap">
    <textarea class="bottom-box" id="bottomSearch" rows="1"
      placeholder="Ask another question…"
      oninput="handleBottomInput(this)"
      onkeydown="handleBottomKey(event)"
    ></textarea>
    <button class="bottom-send" onclick="submitBottom()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
    </button>
  </div>
</div>

<script>
// ─── STATE ───
let currentLang = 'fr';

// ─── CONTENT DATABASE ───
const content = {
  suggestions: {
    fr: [
      { key: 'intro',    icon: '👋', label: 'À propos de Nina',     sub: 'Qui suis-je ?' },
      { key: 'parcours', icon: '🎓', label: 'Parcours académique',  sub: 'Formation & diplômes' },
      { key: 'projets',  icon: '🛠️', label: 'Mes projets',          sub: 'Ce que j\'ai construit' },
      { key: 'skills',   icon: '⚡', label: 'Compétences',          sub: 'Langages & outils' },
    ],
    en: [
      { key: 'intro',    icon: '👋', label: 'About Nina',           sub: 'Who am I?' },
      { key: 'parcours', icon: '🎓', label: 'Academic background',  sub: 'Education & degrees' },
      { key: 'projets',  icon: '🛠️', label: 'My projects',          sub: 'What I\'ve built' },
      { key: 'skills',   icon: '⚡', label: 'Skills',               sub: 'Languages & tools' },
    ]
  },
  pills: {
    fr: [
      { key: 'intro',    emoji: '👋', label: 'Qui est Nina ?' },
      { key: 'parcours', emoji: '🎓', label: 'Parcours' },
      { key: 'projets',  emoji: '🛠️', label: 'Projets' },
      { key: 'skills',   emoji: '⚡', label: 'Compétences' },

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btnFR').classList.toggle('active', lang === 'fr');
  document.getElementById('btnEN').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;

  const titles = {
    fr: 'Ready when you are.',
    en: 'Ready when you are.'
  };
  document.getElementById('homeTitle').textContent = titles[lang];
  document.querySelector('#mainSearch').placeholder = lang === 'fr' ? 'Pose-moi une question sur Nina…' : 'Ask me anything about Nina…';
  document.querySelector('#bottomSearch').placeholder = lang === 'fr' ? 'Pose une autre question…' : 'Ask another question…';
  
  // update back button
  const bb = document.querySelector('#backBtn span');
  if (bb) bb.textContent = lang === 'fr' ? 'Nouvelle conversation' : 'New chat';

  renderPills();
  renderSuggestions('');
}

// ─── PILLS ───
function renderPills() {
  const pills = content.pills[currentLang];
  const row = document.getElementById('pillsRow');
  row.innerHTML = pills.map(p => `
    <button class="pill" onclick="navigate('${p.key}')">
      <span class="pill-emoji">${p.emoji}</span>${p.label}
    </button>
  `).join('');
}

// ─── SUGGESTIONS ───
function renderSuggestions(query) {
  const sugs = content.suggestions[currentLang];
  const filtered = query.trim()
    ? sugs.filter(s => s.label.toLowerCase().includes(query.toLowerCase()) || s.key.includes(query.toLowerCase()))
    : sugs;
  
  const dd = document.getElementById('suggestionsDropdown');
  if (filtered.length === 0) { dd.classList.remove('visible'); return; }
  
  dd.innerHTML = filtered.map(s => `
    <div class="suggestion-item" onclick="navigate('${s.key}')">
      <div class="suggestion-icon">${s.icon}</div>
      <div>
        <div>${s.label}</div>
        <div class="suggestion-meta">${s.sub}</div>
      </div>
    </div>
  `).join('');
  dd.classList.add('visible');
}

function showSuggestions() {
  renderSuggestions(document.getElementById('mainSearch').value);
}

function hideSuggestions() {
  setTimeout(() => document.getElementById('suggestionsDropdown').classList.remove('visible'), 150);
}

// ─── INPUT HANDLERS ───
function handleInput(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
  const val = el.value.trim();
  document.getElementById('mainSendBtn').disabled = !val;
  renderSuggestions(val);
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitSearch(); }
  if (e.key === 'Escape') hideSuggestions();
}

function handleBottomInput(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function handleBottomKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitBottom(); }
}

// ─── NAVIGATION ───
function navigate(key) {
  hideSuggestions();
  document.getElementById('mainSearch').value = '';
  document.getElementById('mainSendBtn').disabled = true;
  showResponse(key);
}

function submitSearch() {
  const val = document.getElementById('mainSearch').value.trim();
  if (!val) return;
  
  // Try to match to a section
  const keys = ['intro', 'parcours', 'projets', 'skills'];
  const sugs = content.suggestions[currentLang];
  const match = sugs.find(s =>
    s.label.toLowerCase().includes(val.toLowerCase()) ||
    s.key.includes(val.toLowerCase()) ||
    val.toLowerCase().includes(s.key)
  );
  
  if (match) {
    navigate(match.key);
  } else {
    // Show a "I don't understand" response
    showUnknown(val);
  }
}

function submitBottom() {
  const val = document.getElementById('bottomSearch').value.trim();

  window.scrollTo(0, 0);
  
  setTimeout(() => {
    const ninaText = document.querySelector('#ninaResponseBlock .nina-text');
    ninaText.innerHTML = data.html + `
      <div class="related-section">
        <div class="related-title">${relatedLabel}</div>
        <div class="related-pills">
          ${relatedPills.map(p => `<div class="related-pill" onclick="navigate('${p.key}')">${p.icon} ${p.label}</div>`).join('')}
        </div>
      </div>
    `;
  }, 900);
}

function appendUnknown(query) {
  const content_el = document.getElementById('responseContent');
  const unknownMsg = currentLang === 'fr'
    ? `Hmm, je ne suis pas sûre de comprendre exactement ce que tu cherches 🤔 Essaie de cliquer sur l'une des sections ci-dessous, ou utilise des mots-clés comme <em>intro</em>, <em>projets</em>, <em>parcours</em>, ou <em>skills</em>.`
    : `Hmm, I'm not quite sure what you're looking for 🤔 Try clicking one of the sections below, or use keywords like <em>intro</em>, <em>projects</em>, <em>background</em>, or <em>skills</em>.`;
  
  const sugs = content.suggestions[currentLang];
  content_el.innerHTML += `
    <div class="user-message-bubble fade-in"><div class="user-bubble">${query}</div></div>
    <div class="nina-response fade-in">
      <div class="nina-avatar">✦</div>
      <div class="nina-text">
        <p>${unknownMsg}</p>
        <div class="related-pills" style="margin-top:12px">
          ${sugs.map(s => `<div class="related-pill" onclick="navigate('${s.key}')">${s.icon} ${s.label}</div>`).join('')}
        </div>
      </div>
    </div>
  `;
  window.scrollTo(0, document.body.scrollHeight);
}

function showUnknown(query) {
  const responseScreen = document.getElementById('responseScreen');
  const homeScreen = document.getElementById('homeScreen');
  const bottomBar = document.getElementById('bottomBar');
  const backBtn = document.getElementById('backBtn');
  
  homeScreen.style.display = 'none';
  responseScreen.classList.add('active');
  bottomBar.style.display = 'block';
  backBtn.style.display = 'flex';
  
  document.getElementById('responseContent').innerHTML = '';
  appendUnknown(query);
}

// ─── GO HOME ───
function goHome() {
  document.getElementById('homeScreen').style.display = '';
  document.getElementById('responseScreen').classList.remove('active');
  document.getElementById('bottomBar').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('mainSearch').value = '';
  document.getElementById('mainSendBtn').disabled = true;
  document.getElementById('responseContent').innerHTML = '';
  window.scrollTo(0, 0);
}

// ─── CLOSE SUGGESTIONS ON CLICK OUTSIDE ───
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-wrapper')) hideSuggestions();
});

// ─── INIT ───
setLang('fr');
</script>
</body>
</html>
